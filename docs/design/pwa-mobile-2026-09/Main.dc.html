<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #1A2014; background: #F5F1E8; -webkit-font-smoothing: antialiased; }
    a { color: #4A5E3A; text-decoration: none; } a:hover { color: #26331C; }
    button, input { font-family: inherit; }
    .display { font-family: Sora, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; }
    .label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6758; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .snap { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6758; }
    .card { background: #FFFFFF; border: 1px solid #D9D2C2; border-radius: 16px; box-shadow: 0 1px 2px rgba(26,32,20,0.04), 0 8px 24px -12px rgba(26,32,20,0.12); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 12px; font-size: 15px; font-weight: 600; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
    .btn-olive { background: #4A5E3A; color: #FFFFFF; }
    .btn-terra { background: #D98C4A; color: #1A2014; }
    .btn-ghost { background: #FFFFFF; color: #1A2014; border-color: #D9D2C2; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D9D2C2; font-size: 13px; font-weight: 600; color: #1A2014; white-space: nowrap; }
    .chip-terra { background: #F6E3D2; border-color: #EBC7A6; color: #8A4A18; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: #1A2014; }
    .field input { height: 48px; border: 1px solid #D9D2C2; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #1A2014; background: #FFFFFF; }
    .field input::placeholder { color: #8A9082; }
    .hint { font-size: 12px; color: #5F6758; line-height: 1.45; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 0; color: #5F6758; font-size: 11px; font-weight: 600; text-decoration: none; }
    .tab.on { color: #4A5E3A; }
    .kpi { display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 10px; background: #FFFFFF; border: 1px solid #D9D2C2; border-radius: 14px; }
    .kpi .v { font-family: Sora, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #1A2014; line-height: 1.05; }
    .kpi .k { font-size: 11px; font-weight: 600; color: #4C5546; line-height: 1.3; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .divider { height: 1px; background: #E8E2D4; }
    .sea { background: #E4E8DD; }
  </style>
</helmet>
